name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-and-secrets:
    name: Semgrep and Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
          enable-cache: true

      - name: Install pinned scanners
        run: |
          ./scripts/install-linux-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
          uv sync --frozen --no-build

      - name: Verify narrow Gitleaks allowlist
        run: |
          set -eu

          probe_root="$(mktemp -d)"
          trap 'rm -rf "$probe_root"' EXIT
          mkdir -p \
            "$probe_root/allowed" \
            "$probe_root/allowed/evals/sync-traycer-notion-trigger" \
            "$probe_root/rejected" \
            "$probe_root/wrong-path/sub" \
            "$probe_root/wrong-path/evals/other-suite"
          checksum="$(printf '%s' 'gitleaks-regression-probe' | sha256sum | cut -d ' ' -f 1)"

          cat > "$probe_root/default-only.toml" <<'EOF'
          [extend]
          useDefault = true
          EOF

          for repository in \
            "$probe_root/allowed" \
            "$probe_root/rejected" \
            "$probe_root/wrong-path"; do
            git -C "$repository" init --quiet
            git -C "$repository" config user.name "Gitleaks regression probe"
            git -C "$repository" config user.email "gitleaks-probe@example.invalid"
          done

          printf '  "skills/huggingface-tool-builder/references/hf_model_papers_auth.sh:%s"\n' \
            "$checksum" > "$probe_root/allowed/.shell-quality-baseline.json"
          printf '  "key_sha256": "%s"\n' \
            "$checksum" > \
            "$probe_root/allowed/evals/sync-traycer-notion-trigger/key-manifest.json"
          printf '  "key_manifest_sha256": "%s",\n  "key_sha256": "%s"\n' \
            "$checksum" "$checksum" > \
            "$probe_root/allowed/evals/sync-traycer-notion-trigger/proof-report.json"
          printf '  "api_key": "%s"\n' \
            "$checksum" > "$probe_root/rejected/.shell-quality-baseline.json"
          printf '  "skills/huggingface-tool-builder/references/hf_model_papers_auth.sh:%s"\n' \
            "$checksum" > "$probe_root/wrong-path/sub/.shell-quality-baseline.json"
          printf '  "key_sha256": "%s"\n' \
            "$checksum" > "$probe_root/wrong-path/evals/other-suite/key-manifest.json"

          git -C "$probe_root/allowed" add \
            .shell-quality-baseline.json \
            evals/sync-traycer-notion-trigger/key-manifest.json \
            evals/sync-traycer-notion-trigger/proof-report.json
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -C "$probe_root/allowed" commit --quiet --message "Add allowed checksum"
          git -C "$probe_root/rejected" add .shell-quality-baseline.json
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -C "$probe_root/rejected" commit --quiet --message "Add rejected secret"
          git -C "$probe_root/wrong-path" add \
            sub/.shell-quality-baseline.json \
            evals/other-suite/key-manifest.json
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -C "$probe_root/wrong-path" commit --quiet --message "Add wrong-path checksum"

          if gitleaks git \
            --config "$probe_root/default-only.toml" \
            --no-banner \
            --report-format json \
            --report-path "$probe_root/control-report.json" \
            "$probe_root/allowed"; then
            echo "Default Gitleaks rules did not detect the checksum fixture" >&2
            exit 1
          fi
          jq -e \
            'any(.[]; .RuleID == "generic-api-key" and .File == ".shell-quality-baseline.json")' \
            "$probe_root/control-report.json" > /dev/null

          gitleaks git --config "$GITHUB_WORKSPACE/.gitleaks.toml" --no-banner "$probe_root/allowed"
          if gitleaks git \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner \
            --report-format json \
            --report-path "$probe_root/rejected-report.json" \
            "$probe_root/rejected"; then
            echo "Gitleaks accepted a non-baseline secret-like value" >&2
            exit 1
          fi
          jq -e \
            'any(.[]; .RuleID == "generic-api-key" and .File == ".shell-quality-baseline.json")' \
            "$probe_root/rejected-report.json" > /dev/null
          if gitleaks git \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner \
            --report-format json \
            --report-path "$probe_root/wrong-path-report.json" \
            "$probe_root/wrong-path"; then
            echo "Gitleaks accepted a checksum outside the baseline path" >&2
            exit 1
          fi
          jq -e \
            'any(.[]; .RuleID == "generic-api-key" and .File == "sub/.shell-quality-baseline.json")' \
            "$probe_root/wrong-path-report.json" > /dev/null
          jq -e \
            'any(.[]; .RuleID == "generic-api-key" and .File == "evals/other-suite/key-manifest.json")' \
            "$probe_root/wrong-path-report.json" > /dev/null

      - name: Run Semgrep community security rules
        run: >-
          uv run --frozen --no-build semgrep scan
          --config p/default
          --config p/security-audit
          --error
          --metrics=off
          --exclude node_modules
          --exclude .venv
          --exclude vendor/skill-audit/skill-audit/node_modules
          --exclude vendor/skill-audit/skill-audit/dist
          .

      - name: Scan Git history for secrets
        run: >-
          gitleaks git
          --config "$GITHUB_WORKSPACE/.gitleaks.toml"
          --redact
          --verbose
          .

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan dependencies, configuration, and secrets
        run: >-
          trivy fs
          --scanners vuln,misconfig,secret
          --severity MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs node_modules
          --skip-dirs .venv
          --skip-dirs vendor/skill-audit/skill-audit/node_modules
          --skip-dirs vendor/skill-audit/skill-audit/dist
          .
