sonar.organization=nfma
sonar.projectKey=nfma_agent-skills
sonar.projectName=agent-skills
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=.github,mcp,scripts,skills,eslint.config.mjs
sonar.tests=tests
sonar.test.inclusions=tests/**/*
sonar.exclusions=skills/skill-audit/**,node_modules/**,.venv/**,vendor/skill-audit/dist/**
sonar.coverage.exclusions=**/*

# The released create-agent-skill bundle is hash-bound to reviewed evaluation evidence.
# These rules misclassify intentional direct-CLI paths, bounded frontmatter parsers,
# and a dictionary comprehension. Keep the exceptions exact by rule and resource so
# the evaluated bytes remain unchanged and unrelated findings remain active.
sonar.issue.ignore.multicriteria=casTracePaths,casProofPaths,casInventoryRegex,casBundleRegex,casProofDict
sonar.issue.ignore.multicriteria.casTracePaths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.casTracePaths.resourceKey=skills/create-agent-skill/scripts/isolation_trace.py
