name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    environment: sonar
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Check for SonarQube Cloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SECRETS_UNAVAILABLE: >-
            ${{ github.actor == 'dependabot[bot]' ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.fork) }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$SECRETS_UNAVAILABLE" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping SonarQube Cloud analysis: Actions secrets are not available to this run."
          else
            echo "SONAR_TOKEN is required; add it as a repository Actions secret." >&2
            exit 1
          fi

      - name: Scan and wait for the quality gate
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
