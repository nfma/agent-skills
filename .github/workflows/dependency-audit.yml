name: Dependency audit

# Two independent advisory sources, both acted on.
#
# `npm audit` resolves the committed lockfile, so it is the only one of the two
# that can judge a pull request's own tree.
#
# Dependabot alerts are computed by GitHub against the *default branch*, not
# against a pull request head, so running that check on a pull request would
# report on `main` rather than on the change under review. It therefore runs on
# pushes to `main` and on a weekly schedule, where it is measuring the thing it
# actually describes.
#
# The alert half needs a token the workflow does not get by default. The Actions
# `GITHUB_TOKEN` cannot read the Dependabot alerts API: it returns HTTP 403
# `Resource not accessible by integration`, both with the default
# `contents: read` and with `security-events: read` added. That permission covers
# code scanning, not Dependabot alerts, and the workflow `permissions:` block
# exposes no key that does. Set a repository Actions secret
# `DEPENDABOT_ALERTS_TOKEN` carrying Dependabot-alerts read access to activate
# this half; until then the job reports that it did not run rather than
# reporting a clean result.
#
# Scope note: this audits the repository's own root package. The vendored
# `skill-audit` submodule is analyzed by its own repository's pipeline.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm advisory database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Threshold is `low` deliberately: Dependabot reports every severity, and a
      # higher threshold here would leave a gap between the two sources.
      - name: Audit resolved dependency tree
        run: npm audit --audit-level=low

  dependabot-alerts:
    name: GitHub Dependabot alerts
    # Alerts describe the default branch, so this is meaningless on a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require no open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          set -euo pipefail

          # Not configured. Say so loudly and say what is still covered, so this
          # can never be mistaken for "no alerts found".
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Dependabot alerts were NOT checked: repository secret DEPENDABOT_ALERTS_TOKEN is not set. Dependencies are currently gated by npm audit alone. Add a token with Dependabot-alerts read access to enable the second source."
            echo "Dependabot alert check did not run: DEPENDABOT_ALERTS_TOKEN is not configured."
            echo "This is not a clean result — it is an unchecked one."
            exit 0
          fi

          # Configured but unusable is a real failure: fail closed rather than
          # let a broken token look like a clean tree.
          if ! alerts=$(gh api \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            2>&1); then
            echo "Could not read Dependabot alerts:" >&2
            echo "$alerts" >&2
            echo >&2
            echo "DEPENDABOT_ALERTS_TOKEN is set but cannot read the alerts API;" >&2
            echo "it most likely lacks Dependabot-alerts read access." >&2
            exit 1
          fi

          count=$(printf '%s' "$alerts" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No open Dependabot alerts."
            exit 0
          fi

          echo "$count open Dependabot alert(s):" >&2
          printf '%s' "$alerts" | jq -r '.[]
            | "  \(.security_advisory.severity)\t\(.dependency.package.name)\t\(.dependency.scope)\tfixed in \(.security_vulnerability.first_patched_version.identifier // "no patch available")"' >&2
          exit 1
