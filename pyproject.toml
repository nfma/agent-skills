[project]
name = "agent-skills-ci"
version = "0.0.0"
description = "Pinned Python quality toolchain for the shared skills repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "hypothesis==6.165.9",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "ruff==0.16.2",
  "semgrep==1.173.0",
  "yamllint==1.38.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.pyright]
exclude = ["**/node_modules", "vendor"]
include = ["skills"]
pythonVersion = "3.11"
reportMissingImports = false
reportMissingTypeStubs = false
typeCheckingMode = "basic"

[tool.mypy]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
python_version = "3.11"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["node_modules", "vendor"]
skips = ["B101"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { semgrep = false }
required-version = "==0.12.1"
