name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    environment: sonar
    timeout-minutes: 15
    steps:
      - name: Classify pull request trust
        id: trust
        env:
          UNTRUSTED_PULL_REQUEST: >-
            ${{ github.event_name == 'pull_request' &&
            (github.event.pull_request.user.login == 'dependabot[bot]' ||
            github.event.pull_request.head.repo.fork) }}
        run: |
          if [ "$UNTRUSTED_PULL_REQUEST" = "true" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping SonarQube Cloud analysis for a Dependabot or fork pull request."
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out full history
        if: steps.trust.outputs.trusted == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Check for SonarQube Cloud token
        if: steps.trust.outputs.trusted == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required; add it as a repository Actions secret." >&2
            exit 1
          fi

      - name: Scan and wait for the quality gate
        if: steps.trust.outputs.trusted == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
