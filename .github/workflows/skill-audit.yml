name: Skill audit

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  attestations: read # Verify provenance for pinned release assets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit all skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Install and verify pinned skill-audit release
        run: ./scripts/prepare-vendored-skills.sh

      - name: Verify release provenance and descriptor bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pin_field() {
            node -p \
              'JSON.parse(require("node:fs").readFileSync(".skill-audit-release.json"))[process.argv[1]]' \
              "$1"
          }
          release_tag=$(pin_field tag)
          source_repository=$(pin_field sourceRepository)
          source_commit=$(pin_field sourceCommit)
          descriptor_name="skill-audit-${release_tag}-release.json"
          descriptor_asset="$RUNNER_TEMP/$descriptor_name"

          gh release download "$release_tag" \
            --repo "$source_repository" \
            --pattern "$descriptor_name" \
            --dir "$RUNNER_TEMP"
          node scripts/verify-skill-audit-release.mjs \
            --release-descriptor "$descriptor_asset"
          gh attestation verify .skill-audit-release.json \
            --repo "$source_repository" \
            --signer-workflow "$source_repository/.github/workflows/release.yml" \
            --source-digest "$source_commit" \
            --source-ref "refs/tags/$release_tag" \
            --deny-self-hosted-runners
          gh attestation verify vendor/skill-audit/dist/skill-audit.mjs \
            --repo "$source_repository" \
            --signer-workflow "$source_repository/.github/workflows/release.yml" \
            --source-digest "$source_commit" \
            --source-ref "refs/tags/$release_tag" \
            --deny-self-hosted-runners

      - name: Test the release contract
        run: node --test tests/skill-audit-release.test.js

      - name: Audit every skill
        run: node scripts/audit-skills.mjs
