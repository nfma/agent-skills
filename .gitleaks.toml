title = "agent-skills Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Ignore generated shfmt checksums in the shell quality baseline"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^\.shell-quality-baseline\.json$''']
  regexes = [
    '''^\s*"skills/[A-Za-z0-9_./-]+\.sh:[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore sealed grader-key digests in generated skill-eval manifests"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^evals/(create-agent-skill-(zero-tools|read-only|loaded-content)|[a-z0-9-]+)/key-manifest\.json$''']
  regexes = [
    '''^\s*"key_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore generated SHA-256 evidence fields in the Notion sync eval"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^evals/sync-traycer-notion-trigger/(key-manifest|proof-report)\.json$''',
  ]
  regexes = [
    '''^\s*"key(_manifest)?_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore generated SHA-256 evidence fields in the Notion sync eval"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^evals/sync-traycer-notion/(key-manifest|calibration-manifest)\.json$''',
  ]
  regexes = [
    '''^\s*"key(_manifest)?_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore generated SHA-256 evidence fields in the production Rust eval"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^evals/write-production-rust/(semantic-key-manifest|proof-report)\.json$''',
  ]
  regexes = [
    '''^\s*"key(_manifest)?_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore generated SHA-256 evidence fields in the Rust loaded-content eval"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^evals/test-rust-loaded-content/key-manifest\.json$''']
  regexes = [
    '''^\s*"key(_manifest)?_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Ignore generated SHA-256 evidence fields in create-agent-skill evals"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''^evals/create-agent-skill-(read-only|loaded-content|zero-tools)/key-manifest\.json$''',
  ]
  regexes = [
    '''^\s*"key_sha256":\s*"[a-f0-9]{64}"[,]?\s*$''',
  ]
